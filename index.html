<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Here comes the sun</title>
    <link rel="stylesheet" href="syles.css">
</head>
<body>
    <div id="clouds"></div>
    <canvas id="rain"></canvas>
    <main>
        <div id="time"></div>
        <div class="row">
            <div class="node" id="temp">
                <h1 id="currenttemp">--</h1>
                <p id="weather">Fetching weather data...</p>
                <p id="templowhigh"></p>
            </div>
        </div>

        <div class="row">
            <div class="rtitle">Air</div>
            <div class="node" id="wind">
                <h2>Wind speed</h2>
                <div id="windspeed"><p>--</p></div>
                <div id="winddir"></div>
            </div>
            <div class="node" id="quality">
                <h2>Air quality</h2>
                <h1 id="airquality">-</h1>
            </div>
        </div>

        <div class="row">
            <div class="rtitle">Meteoralogics</div>
            <div class="node" id="forecast">
                <h2>Forecast</h2>
                <table>
                    <tr>
                        <th>Mon</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                    <tr>
                        <th>Tus</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                    <tr>
                        <th>Wed</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                    <tr>
                        <th>Thr</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                    <tr>
                        <th>Fri</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                    <tr>
                        <th>Sat</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                    <tr>
                        <th>Sun</th>
                        <td>Rain</td>
                        <td>15°</td>
                    </tr>
                </table>
            </div>
            <div class="node" id="sunset">
                <h2 id="sunsettitle">------</h2>
                <h1 id="sunsettime">---</h1>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
